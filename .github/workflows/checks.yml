name: Offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Keep evidence out of Git
        run: |
          if [[ -n "$(git ls-files -- evidence/)" ]]; then
            echo "::error::Keep evidence in the ignored local evidence directory. Remove tracked evidence from the change."
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install evaluator dependencies
        run: python -m pip install -r requirements-evaluator.txt
      - name: Test controller
        run: node --test
      - name: Test evaluator and archive
        run: python -m unittest discover -s tests -v
